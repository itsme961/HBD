<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Um e Ruman</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    background-size: 400% 400%;
    animation: bg 10s ease infinite;
    font-family: 'Segoe UI', sans-serif;
    text-align: center; padding: 25px 20px; overflow-x: hidden;
  }
  @keyframes bg {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  h1 {
    font-size: 2.2rem; color: #fff;
    text-shadow: 0 0 10px #ff4081, 0 0 20px #ff4081;
    animation: glow 1.5s ease-in-out infinite alternate;
    margin-bottom: 10px;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px #fff, 0 0 20px #ff4081; }
    to { text-shadow: 0 0 20px #fff, 0 0 40px #ff4081, 0 0 60px #ff1493; }
  }
  .name {
    font-size: 2.4rem; color: #fff700; font-weight: bold;
    text-shadow: 0 0 15px #ff6f00, 0 0 25px #ff6f00;
    animation: pop 1s ease infinite alternate; margin: 10px 0 20px;
  }
  @keyframes pop { from { transform: scale(1); } to { transform: scale(1.06); } }
  .cake { font-size: 3.5rem; animation: bounce 1.2s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  .msg {
    color: #fff; font-size: 1.1rem; line-height: 1.7;
    margin-top: 20px; max-width: 340px;
    text-shadow: 0 0 8px rgba(0,0,0,0.4);
    background: rgba(255,255,255,0.15);
    padding: 18px 20px; border-radius: 20px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.3);
  }
  .from {
    color: #fff; font-size: 1.05rem; margin-top: 16px;
    font-weight: bold; font-style: italic;
    text-shadow: 0 0 10px #ff1493;
  }
  button {
    margin-top: 22px; padding: 12px 26px; font-size: 1rem;
    border: none; border-radius: 30px; background: #ff4081; color: #fff;
    font-weight: bold; box-shadow: 0 4px 15px rgba(255,64,129,0.6);
    cursor: pointer; transition: transform 0.2s;
  }
  button:active { transform: scale(0.95); }
  .balloon {
    position: fixed; bottom: -100px; font-size: 2.5rem;
    animation: float 8s linear infinite; pointer-events: none;
  }
  @keyframes float {
    to { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="cake">🎂</div>
  <h1>Happy Birthday</h1>
  <div class="name">Um e Ruman 🤍</div>
  <div class="cake">🎉🎈🎁</div>

  <p class="msg">
    May Allah bless You with every kind of happiness in this world. May you never ever see the face of sadness and pain.. Ameen ❤
  </p>

  <p class="from">From Madiha Shahid 😅</p>

  <button onclick="playMusic()">🎵 Music Play</button>

  <script>
    // Balloons animation
    const emojis = ['🎈','🎈','🎉','🎊','💖','🌸','🤍'];
    for (let i = 0; i < 14; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      b.style.left = Math.random() * 100 + 'vw';
      b.style.animationDelay = Math.random() * 8 + 's';
      b.style.animationDuration = (6 + Math.random()*4) + 's';
      document.body.appendChild(b);
    }

    // Birthday tune
    function playMusic() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [
        [264,0.4],[264,0.2],[297,0.6],[264,0.6],[352,0.6],[330,1.2],
        [264,0.4],[264,0.2],[297,0.6],[264,0.6],[396,0.6],[352,1.2],
        [264,0.4],[264,0.2],[528,0.6],[440,0.6],[352,0.6],[330,0.6],[297,1.2],
        [466,0.4],[466,0.2],[440,0.6],[352,0.6],[396,0.6],[352,1.2]
      ];
      let t = ctx.currentTime;
      notes.forEach(([freq, dur]) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + dur); t += dur;
      });
    }
  </script>

</body>
</html>
